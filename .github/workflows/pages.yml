name: Publicar app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site com as imagens do banner do canal
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          B="https://yt3.googleusercontent.com/oQX3CLkqksfLH7eIWVedvX9r8iurZQGh8LBqIwpwVDq1jp7z1A0VQb-sVT05c1iipW3VXIlFQA"
          mkdir -p site
          cp index.html manifest.json politica.html site/
          curl -sfL "$B=w2048-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj" -o recorte.jpg
          curl -sfL "$B=w2048-k-c0xffffffff-no-nd-rj" -o inteiro.jpg
          convert recorte.jpg -resize 1400x -quality 84 site/banner-faixa.jpg
          convert inteiro.jpg -resize 2048x -crop 2048x420+0+732 +repage -resize 1400x -quality 80 site/fundo.jpg
          convert recorte.jpg -resize 2048x -crop 250x250+1440+89 +repage -resize 512x512 site/icone-512.png
          convert site/icone-512.png -resize 192x192 site/icone-192.png
          convert site/icone-512.png -resize 180x180 site/apple-touch-icon.png
          convert site/icone-512.png -resize 64x64 site/icone.png
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
